<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>গ্যালারি | সাধু যোসেফ যুব সংঘ</title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            color: #222;
        }


        /* Header */

        header {

            background: linear-gradient(
                135deg,
                #173b57,
                #285d7d
            );

            color: white;

            text-align: center;

            padding: 25px 15px;
        }


        header h1 {

            margin: 0;

            font-size: 28px;
        }


        header p {

            margin: 8px 0 0;

            font-size: 15px;
        }


        /* Main Container */

        .container {

            max-width: 650px;

            margin: 30px auto;

            padding: 0 15px;
        }


        /* Empty Gallery */

        .empty-gallery {

            background: white;

            text-align: center;

            padding: 45px 20px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }


        .empty-gallery .icon {

            font-size: 55px;

            margin-bottom: 10px;
        }


        .empty-gallery h2 {

            color: #173b57;

            margin-bottom: 10px;
        }


        .empty-gallery p {

            color: #777;

            line-height: 1.7;

            margin: 0;
        }


        /* Back Button */

        .back {

            display: block;

            width: fit-content;

            margin: 25px auto;

            padding: 10px 20px;

            background: #173b57;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }


        .back:hover {

            background: #285d7d;
        }
footer {
    margin-top: 30px;
    padding: 20px;
    text-align: center;
    background: #173b57;
    color: white;
    font-size: 14px;
}

footer p {
    margin: 5px 0;
}

    </style>

</head>


<body>


    <!-- Header -->

    <header>

        <h1>🖼️ গ্যালারি</h1>

        <p>
            সাধু যোসেফ যুব সংঘ
        </p>

    </header>



    <!-- Main -->

    <div class="container">


        <div class="empty-gallery">


            <div class="icon">
                🖼️
            </div>


            <h2>
                বর্তমানে কোনো ছবি নেই
            </h2>


            <p>
                সংঘের বিভিন্ন কার্যক্রম ও অনুষ্ঠানের ছবি
                এখানে প্রকাশ করা হবে।
            </p>


        </div>



        <a href="index.html" class="back">

            ⬅ হোম পেজে ফিরে যান

        </a>


    </div>

<footer>
    <p>© 2026 সাধু যোসেফ যুব সংঘ</p>
    <p>All Rights Reserved.</p>
</footer>
</body>

</html>
