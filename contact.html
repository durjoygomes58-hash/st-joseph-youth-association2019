<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>যোগাযোগ | সাধু যোসেফ যুব সংঘ</title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            color: #222;
        }


        /* Header */

        header {

            background: linear-gradient(
                135deg,
                #173b57,
                #285d7d
            );

            color: white;

            text-align: center;

            padding: 25px 15px;
        }


        header h1 {

            margin: 0;

            font-size: 28px;
        }


        header p {

            margin: 8px 0 0;

            font-size: 15px;
        }


        /* Container */

        .container {

            max-width: 650px;

            margin: 25px auto;

            padding: 0 15px;
        }


        /* Card */

        .card {

            background: white;

            padding: 22px;

            margin-bottom: 18px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }


        .card h2 {

            margin-top: 0;

            color: #173b57;

            font-size: 21px;
        }


        .info {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 16px 0;

            color: #444;
        }


        .icon {

            font-size: 28px;

            min-width: 35px;

        }


        .info p {

            margin: 0;

            line-height: 1.6;

        }


        /* Social */

        .social {

            display: flex;

            flex-direction: column;

            gap: 12px;

            margin-top: 15px;
        }


        .social a {

            text-decoration: none;

            color: white;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            background: #173b57;
        }


        .social a:hover {

            background: #285d7d;
        }


        /* Back Button */

        .back {

            display: block;

            width: fit-content;

            margin: 25px auto;

            padding: 10px 20px;

            background: #173b57;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }


        .back:hover {

            background: #285d7d;
        }
      footer {
    margin-top: 30px;
    padding: 20px;
    text-align: center;
    background: #173b57;
    color: white;
    font-size: 14px;
}

footer p {
    margin: 5px 0;
}


    </style>

</head>


<body>


    <!-- Header -->

    <header>

        <h1>📞 যোগাযোগ</h1>

        <p>
            সাধু যোসেফ যুব সংঘ
        </p>

    </header>



    <div class="container">


        <!-- Contact Information -->

        <div class="card">

            <h2>
                📍 যোগাযোগের তথ্য
            </h2>


            <div class="info">

                <div class="icon">
                    📍
                </div>

                <p>
                    <strong>ঠিকানা</strong><br>
                    এখানে সংঘের ঠিকানা লিখুন
                </p>

            </div>


            <div class="info">

                

                
            </div>


        </div>



        <!-- Social Media -->

        <div class="card">

            <h2>
                🌐 আমাদের সাথে যুক্ত থাকুন
            </h2>


            <div class="social">

                <a href="#" onclick="return false;">
                    📘 Facebook
                </a>


 

            </div>

        </div>



        <!-- Back -->

        <a href="index.html" class="back">

            ⬅ হোম পেজে ফিরে যান

        </a>


    </div>
<footer>
    <p>© 2026 সাধু যোসেফ যুব সংঘ</p>
    <p>All Rights Reserved.</p>
</footer>

</body>

</html>
